<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор букета — FLORIS</title>
  <meta name="description" content="Зберіть власний букет: палітра, квіти, кількість, упаковка та листівка.">
  <meta name="theme-color" content="#5c161e">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>.curtain{display:none}[data-reveal]{opacity:1;transform:none}</style></noscript>
</head>
<body data-page="builder" data-palette="velvet">
  <div class="curtain" aria-hidden="true"><img src="assets/logo-white.svg" alt=""><span class="curtain__bar"></span></div>
  <script>try{if(!sessionStorage.getItem('floris-visited'))document.body.classList.add('is-first')}catch(e){}</script>
  <main>
    <section class="page-hero" data-form="bloom" data-fx="0.5" data-fy="0.2">
      <div class="container">
        <nav class="crumbs" aria-label="Навігація"><a href="index.html">Головна</a><span>/</span><span>Конструктор</span></nav>
        <h1 class="h-display" data-split>Ваш букет — <span class="serif accent">ваші правила</span></h1>
        <p class="lead" data-reveal>Обирайте палітру — і пелюстки навколо теж змінять колір. Ціна рахується миттєво.</p>
      </div>
    </section>
    <section style="padding-bottom:140px" data-form="edges" data-fx="0">
      <div class="container builder">
        <div class="builder__stage bg-velvet" id="stage" data-no-burst>
          <div class="art-holder" style="width:84%"></div>
          <div class="builder__price"><div><small class="muted" id="b-detail"></small><br><b id="b-price">0 ₴</b></div><button class="btn btn--sm" type="submit" form="builder">У кошик <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
        </div>
        <form id="builder" novalidate>
          <div class="step" data-reveal>
            <h3><span>01</span>Палітра</h3>
            <div class="swatches">
              <div class="swatch"><input type="radio" name="palette" id="pl-velvet" value="velvet" checked><label for="pl-velvet"><i style="background:linear-gradient(135deg,#9e2b3b,#3d0910)"></i>Оксамит</label></div>
              <div class="swatch"><input type="radio" name="palette" id="pl-blush" value="blush"><label for="pl-blush"><i style="background:linear-gradient(135deg,#fbe8e4,#e59aa2)"></i>Пудра</label></div>
              <div class="swatch"><input type="radio" name="palette" id="pl-snow" value="snow"><label for="pl-snow"><i style="background:linear-gradient(135deg,#ffffff,#d8c7bd)"></i>Сніг</label></div>
              <div class="swatch"><input type="radio" name="palette" id="pl-sunset" value="sunset"><label for="pl-sunset"><i style="background:linear-gradient(135deg,#f6c39a,#c94f4f)"></i>Захід</label></div>
              <div class="swatch"><input type="radio" name="palette" id="pl-wild" value="wild"><label for="pl-wild"><i style="background:linear-gradient(135deg,#f2c46d,#8d6bb5)"></i>Польові</label></div>
            </div>
          </div>
          <div class="step" data-reveal>
            <h3><span>02</span>Квіти</h3>
            <div class="seg">
              <input type="radio" name="flower" id="fl-rose" value="rose" checked><label for="fl-rose">Троянди<small>95 ₴/шт</small></label>
              <input type="radio" name="flower" id="fl-peony" value="peony"><label for="fl-peony">Півонії<small>180 ₴/шт</small></label>
              <input type="radio" name="flower" id="fl-tulip" value="tulip"><label for="fl-tulip">Тюльпани<small>65 ₴/шт</small></label>
              <input type="radio" name="flower" id="fl-ran" value="ranunculus"><label for="fl-ran">Ранункулюси<small>110 ₴/шт</small></label>
              <input type="radio" name="flower" id="fl-mix" value="mix"><label for="fl-mix">Мікс<small>120 ₴/шт</small></label>
            </div>
          </div>
          <div class="step" data-reveal>
            <h3><span>03</span>Кількість квітів</h3>
            <div class="seg">
              <input type="radio" name="count" id="ct7" value="7"><label for="ct7">7</label>
              <input type="radio" name="count" id="ct11" value="11" checked><label for="ct11">11</label>
              <input type="radio" name="count" id="ct15" value="15"><label for="ct15">15</label>
              <input type="radio" name="count" id="ct25" value="25"><label for="ct25">25</label>
            </div>
          </div>
          <div class="step" data-reveal>
            <h3><span>04</span>Упаковка</h3>
            <div class="seg">
              <input type="radio" name="wrap" id="wr-black" value="black" checked><label for="wr-black">Чорна<small>150 ₴</small></label>
              <input type="radio" name="wrap" id="wr-wine" value="wine"><label for="wr-wine">Бордова<small>150 ₴</small></label>
              <input type="radio" name="wrap" id="wr-blush" value="blush"><label for="wr-blush">Пудрова<small>150 ₴</small></label>
              <input type="radio" name="wrap" id="wr-cream" value="cream"><label for="wr-cream">Кремова<small>120 ₴</small></label>
              <input type="radio" name="wrap" id="wr-kraft" value="kraft"><label for="wr-kraft">Крафт<small>100 ₴</small></label>
            </div>
          </div>
          <div class="step" data-reveal>
            <h3><span>05</span>Листівка <small class="muted" style="font-family:var(--f-body);font-size:12px">+50 ₴</small></h3>
            <div class="field"><label class="visually-hidden" for="note">Текст листівки</label><textarea id="note" name="note" maxlength="120" placeholder="Наприклад: «Ти — моя весна» ✿"></textarea></div>
            <div class="counter-note" id="note-count">0/120</div>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:30px" data-reveal>
            <button class="btn" type="submit">Додати в кошик <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
            <button class="btn btn--ghost" type="button" id="shuffle">Перемішати квіти ↻</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
